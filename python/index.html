<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jamrtc — Python client for JamRTC</title>
<meta name="description" content="Python MIDI peer for JamRTC rooms: join, play, listen, relay, with mido ports.">
<link rel="icon" href="../favicon.ico">
<style>
  :root {
    --bg: #12141a;
    --panel: #1a1d26;
    --panel-2: #212533;
    --fg: #e6e8ee;
    --muted: #9aa3b8;
    --accent: #7cc4ff;
    --accent-dim: #2b6f9e;
    --border: #2c3142;
    --code-bg: #0e1015;
    --ok: #6ee7a8;
    --radius: 8px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --panel-2: #eef1f6;
      --fg: #1b1e26;
      --muted: #5b6478;
      --accent: #0b62a4;
      --accent-dim: #9cc7e5;
      --border: #d8dde7;
      --code-bg: #f0f2f6;
      --ok: #1c7c4a;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .skip {
    position: absolute; left: -9999px; top: 0;
    background: var(--accent); color: #fff; padding: .6rem 1rem; z-index: 100;
  }
  .skip:focus { left: 0; }

  header.top {
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 1.25rem 1.25rem;
    background: var(--panel);
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .brand { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.01em; }
  .brand .ver { color: var(--muted); font-size: .9rem; }
  .tag { margin: .5rem 0 0; color: var(--muted); }

  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 2rem; max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; gap: 1rem; } }

  nav.toc { position: sticky; top: 1rem; align-self: start; font-size: .94rem; }
  nav.toc h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .6rem; }
  nav.toc ul { list-style: none; margin: 0; padding: 0; }
  nav.toc li { margin: .1rem 0; }
  nav.toc a { display: block; padding: .38rem .6rem; border-radius: 6px; text-decoration: none; color: var(--fg); border: 1px solid transparent; }
  nav.toc a:hover { background: var(--panel-2); }
  nav.toc a[aria-current="page"] { background: var(--panel-2); border-color: var(--accent-dim); color: var(--accent); font-weight: 600; }
  nav.toc .sub { margin-top: 1.25rem; }

  main { min-width: 0; }
  main[aria-busy="true"] { opacity: .55; }

  .doc { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem 1.9rem; }
  @media (max-width: 600px) { .doc { padding: 1.15rem 1rem; } }

  .doc h1 { font-size: 1.85rem; margin: 0 0 1rem; line-height: 1.25; }
  .doc h2 { font-size: 1.3rem; margin: 2.2rem 0 .8rem; padding-bottom: .35rem; border-bottom: 1px solid var(--border); }
  .doc h3 { font-size: 1.06rem; margin: 1.6rem 0 .5rem; }
  .doc h4 { font-size: .98rem; margin: 1.3rem 0 .4rem; color: var(--muted); }
  .doc p { margin: .75rem 0; }
  .doc ul, .doc ol { padding-left: 1.4rem; }
  .doc li { margin: .25rem 0; }
  .doc hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
  .doc blockquote { margin: 1rem 0; padding: .35rem 0 .35rem 1rem; border-left: 3px solid var(--accent-dim); color: var(--muted); }
  .doc img { max-width: 100%; }

  .doc code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: .1em .38em; font-size: .89em; }
  .doc pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius); margin: 1rem 0; overflow: hidden; }
  .doc pre > code { display: block; padding: 1rem 1.1rem; overflow-x: auto; background: none; border: 0; font-size: .875rem; line-height: 1.6; }

  .codewrap { position: relative; }
  .copy {
    position: absolute; top: .5rem; right: .5rem;
    font: inherit; font-size: .78rem;
    padding: .3rem .65rem;
    background: var(--panel-2); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; opacity: .35; transition: opacity .15s;
  }
  .codewrap:hover .copy, .copy:focus-visible { opacity: 1; }
  .copy.done { color: var(--ok); border-color: var(--ok); opacity: 1; }

  .doc table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .93rem; }
  .doc th, .doc td { text-align: left; padding: .5rem .7rem; border: 1px solid var(--border); }
  .doc th { background: var(--panel-2); }

  .notice { color: var(--muted); }
  .notice.error { color: #ff8f8f; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  footer { border-top: 1px solid var(--border); color: var(--muted); font-size: .87rem; padding: 1.25rem; }
  footer .wrap { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
</style>
</head>
<body>
<a class="skip" href="#doc">Skip to documentation</a>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>jamrtc</h1>
      <span class="ver" id="pkgVersion"></span>
    </div>
    <p class="tag">A Python MIDI peer for <a href="/">JamRTC</a> rooms — join, play, listen, relay, with <code>mido</code> ports.</p>
  </div>
</header>

<div class="layout">
  <nav class="toc" aria-label="Documentation">
    <h2>Package</h2>
    <ul id="navDocs"></ul>
    <div class="sub">
      <h2>Elsewhere</h2>
      <ul>
        <li><a href="/">JamRTC app</a></li>
        <li><a href="/help-ru.html">Помощь (RU)</a></li>
        <li><a href="/help-en.html">Help (EN)</a></li>
      </ul>
    </div>
  </nav>

  <main id="main" tabindex="-1">
    <article class="doc" id="doc" aria-busy="true">
      <p class="notice">Loading…</p>
    </article>
  </main>
</div>

<footer>
  <div class="wrap">
    <span>jamrtc — <a href="https://github.com/denizsincar29/web_midi_streamer/tree/main/python">source on GitHub</a></span>
    <span>Documentation served by the JamRTC signaler.</span>
  </div>
</footer>

<script type="module">
const LABELS = {
  'README': 'Overview',
  'src/protocol': 'protocol.py',
  'src/peer': 'peer.py',
  'src/observer': 'observer.py',
  'src/midi_backend': 'midi_backend.py',
  'src/__main__': '__main__.py',
  'src/__init__': '__init__.py',
};

// ---------- tiny markdown renderer ----------
// Only the subset the package README uses: headings, fenced code, lists,
// tables, blockquotes, hr, and inline code/bold/links. Everything is escaped
// first, so a stray angle bracket in a doc cannot become markup.
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inline(s) {
  let out = esc(s);
  out = out.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => {
    const safe = /^(https?:|mailto:|\/|#)/.test(u) ? u : '#';
    return `<a href="${safe}"${safe.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${t}</a>`;
  });
  return out;
}

function renderMarkdown(src) {
  const lines = src.replace(/\r\n/g, '\n').split('\n');
  const html = [];
  let inCode = false, codeLang = '', buf = [], inList = false, listType = '', inQuote = false;

  const flushCode = () => {
    html.push(`<div class="codewrap"><pre><code data-lang="${esc(codeLang)}">${esc(buf.join('\n'))}</code></pre><button type="button" class="copy" data-copy>Copy</button></div>`);
    buf = []; inCode = false; codeLang = '';
  };
  const closeList = () => { if (inList) { html.push(`</${listType}>`); inList = false; } };
  const closeQuote = () => { if (inQuote) { html.push('</blockquote>'); inQuote = false; } };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (inCode) {
      if (/^```/.test(line)) flushCode();
      else buf.push(line);
      continue;
    }
    if (/^```/.test(line)) {
      closeList(); closeQuote();
      inCode = true; codeLang = line.slice(3).trim();
      continue;
    }
    if (!line.trim()) { closeList(); closeQuote(); continue; }

    let m;
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
      closeList(); closeQuote();
      const n = m[1].length;
      const id = m[2].toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      html.push(`<h${n} id="${id}">${inline(m[2])}</h${n}>`);
      continue;
    }
    if (/^(---+|\*\*\*+)\s*$/.test(line)) { closeList(); closeQuote(); html.push('<hr>'); continue; }
    if (/^>\s?/.test(line)) {
      closeList();
      if (!inQuote) { html.push('<blockquote>'); inQuote = true; }
      html.push(`<p>${inline(line.replace(/^>\s?/, ''))}</p>`);
      continue;
    }
    closeQuote();
    if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) {
      if (!inList || listType !== 'ul') { closeList(); html.push('<ul>'); inList = true; listType = 'ul'; }
      html.push(`<li>${inline(m[1])}</li>`);
      continue;
    }
    if ((m = /^\s*\d+\.\s+(.*)$/.exec(line))) {
      if (!inList || listType !== 'ol') { closeList(); html.push('<ol>'); inList = true; listType = 'ol'; }
      html.push(`<li>${inline(m[1])}</li>`);
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
      closeList();
      const cells = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      i--;
      html.push('<table><thead><tr>' + head.map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map((r) => '<tr>' + r.map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    closeList();
    html.push(`<p>${inline(line)}</p>`);
  }
  if (inCode) flushCode();
  closeList(); closeQuote();
  return html.join('\n');
}

// ---------- source view: plain text, no markdown surprises ----------
function renderSource(src) {
  return `<div class="codewrap"><pre><code data-lang="python">${esc(src)}</code></pre><button type="button" class="copy" data-copy>Copy</button></div>`;
}

// ---------- copy buttons ----------
let copyTimer = null;
document.addEventListener('click', async (event) => {
  const btn = event.target.closest('[data-copy]');
  if (!btn) return;
  const code = btn.parentElement.querySelector('code');
  if (!code) return;
  try {
    await navigator.clipboard.writeText(code.textContent);
  } catch {
    // Clipboard API needs a secure context and permission; fall back to a
    // selection so the user can still copy by hand.
    const range = document.createRange();
    range.selectNodeContents(code);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    btn.textContent = 'Select & copy';
    return;
  }
  btn.textContent = 'Copied';
  btn.classList.add('done');
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1600);
});

// ---------- navigation + loading ----------
const doc = document.getElementById('doc');
const nav = document.getElementById('navDocs');
const params = new URLSearchParams(location.search);

function currentPath() {
  const p = (location.hash.replace(/^#\/?/, '') || params.get('page') || 'README').replace(/^\/+|\/+$/g, '');
  return LABELS[p] ? p : 'README';
}

function buildNav(pages) {
  nav.innerHTML = '';
  for (const { path } of pages) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = `#/${path}`;
    a.textContent = LABELS[path] || path;
    if (path === currentPath()) a.setAttribute('aria-current', 'page');
    li.appendChild(a);
    nav.appendChild(li);
  }
}

async function load(path) {
  doc.setAttribute('aria-busy', 'true');
  document.title = `${LABELS[path] || path} — jamrtc`;
  try {
    const res = await fetch(`/docs/${path}`, { headers: { Accept: 'text/plain, text/markdown, */*' } });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const text = await res.text();
    doc.innerHTML = path.startsWith('src/') || path.endsWith('.py')
      ? renderSource(text)
      : renderMarkdown(text);
    const m = /v?(\d+\.\d+\.\d+)/.exec(text.slice(0, 4000));
    if (path === 'README' && m) document.getElementById('pkgVersion').textContent = `v${m[1]}`;
    doc.setAttribute('aria-busy', 'false');
    window.scrollTo({ top: 0 });
    document.getElementById('main').focus({ preventScroll: true });
  } catch (err) {
    doc.setAttribute('aria-busy', 'false');
    doc.innerHTML = `<p class="notice error"><strong>Could not load this page.</strong><br>
      The docs endpoint answered: ${esc(err.message)}. The <a href="https://github.com/denizsincar29/web_midi_streamer/tree/main/python">same documentation is on GitHub</a>.</p>`;
  }
  for (const a of nav.querySelectorAll('a')) {
    if (a.hash === `#/${path}`) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
}

async function boot() {
  let pages = Object.keys(LABELS).map((path) => ({ path }));
  try {
    const res = await fetch('/docs/index.json', { headers: { Accept: 'application/json' } });
    if (res.ok) pages = await res.json();
  } catch { /* fall back to the built-in list */ }
  buildNav(pages);
  await load(currentPath());
}

window.addEventListener('hashchange', () => load(currentPath()));
boot();
</script>
</body>
</html>
