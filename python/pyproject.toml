[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jamrtc"
version = "0.1.0"
description = "Python MIDI peer for JamRTC rooms — join, play, listen, relay, with mido ports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["midi", "webrtc", "mido", "jamrtc", "music"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "aiortc>=1.9",
    "websockets>=12",
    "mido>=1.3",
]

[project.optional-dependencies]
ports = ["python-rtmidi>=1.5"]

[project.scripts]
jamrtc = "jamrtc.__main__:main"

[project.urls]
Homepage = "https://github.com/denizsincar29/web_midi_streamer"
Source = "https://github.com/denizsincar29/web_midi_streamer/tree/main/python"

[tool.setuptools]
packages = ["jamrtc"]
